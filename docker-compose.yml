services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer_care_gateway
      POSTGRES_USER: care_gateway
      POSTGRES_PASSWORD: change_me_local_only
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - customer_care_gateway_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care_gateway -d customer_care_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  customer_care_gateway_pg:
